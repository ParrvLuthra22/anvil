# candidates.yaml — Akshat's modules ready for integration
# Branch: integration  (rebased on main, all 240 tests pass)
# Last commit: akshat: fix audit bugs 1-6

modules:
  - owner: akshat
    path: src/anvil/repo/ingest.py
    status: ready
    notes: >
      IssueRef.fetch_error field for structured errors (body is never the error
      text). GITHUB_TOKEN Bearer auth (read-only, never logged). GIT_TERMINAL_PROMPT=0
      + stdin=DEVNULL + 60s tight clone timeout so private/missing repos fail fast.
      Optional git_ref kwarg on clone_repo. TimeoutExpired surfaces as RuntimeError.

  - owner: akshat
    path: src/anvil/repo/deps.py
    status: ready
    notes: >
      ensure_deps never raises (outer try/except). Language-specific helpers:
      Python (isolated venv + test framework), JS (npm ci/install with lock
      detection), Go (go mod download), Rust (cargo fetch), Java (mvn
      dependency:resolve). Each probes for the toolchain with 'command -v' and
      skips cleanly with a clear message if absent. DepsResult.skipped flag added.

  - owner: akshat
    path: src/anvil/sandbox/worktree.py
    status: ready
    notes: >
      Bug 1: repo_root and work_dir resolved to absolute paths in __init__.
      Bug 2: checkpoint() uses 'git stash create' (working tree untouched, returns
      SHA). rollback() uses 'git reset --hard && git clean -fd && git stash apply'.
      Both raise GitError (typed exception) on failure — never return error strings.
      Bug 3: exec() has stdin=DEVNULL; _sanitized_env strips broad secret patterns
      (KEY, TOKEN, SECRET, PASSWORD, CREDENTIAL, AWS_*, GITHUB_*, GH_*,
      ANTHROPIC_*, OPENAI_*, AI_*, GROQ_*, GOOGLE_*); injects PYTHONDONTWRITEBYTECODE=1.
      Bug 4: exec() prepends .anvil_venv/bin to PATH when it exists;
      diff() excludes .anvil_venv and .anvil directories.

  - owner: akshat
    path: src/anvil/sandbox/docker.py
    status: experimental
    notes: >
      Bug 1: paths resolved in __init__.
      Bug 2: checkpoint/rollback use stash create + GitError (same as worktree).
      Bug 3: stdin=DEVNULL on exec.
      Bug 6: Marked EXPERIMENTAL in module docstring, class docstring, and log line.
      Opt-in only — auto backend still prefers worktree.

  - owner: akshat
    path: src/anvil/tools/run_tests.py
    status: ready
    notes: >
      Structured failure extraction (pytest FAILED names, Go --- FAIL, Rust panics,
      TAP). Assertion message extraction. Hard char_cap on output. Optional target
      arg appended to test command.

  - owner: akshat
    path: src/anvil/tools/edit_file.py
    status: ready
    notes: >
      Whitespace-only diff detection: returns warning in output and
      meta['whitespace_only']=True when old and new differ only in whitespace.

tests:
  command: make test
  count: 240
  result: all pass
  coverage:
    - tests/repo/test_ingest.py   # parse_issue_url, fetch_issue, clone_repo + bug-5 regressions
    - tests/repo/test_deps.py     # Python/JS/Go/Rust/Java paths, skipped flag, never-raises
    - tests/repo/test_profile.py  # profile_repo, repo_map
    - tests/sandbox/test_worktree.py  # exec, read/write, diff, checkpoint/rollback + bug-1/2/3/4 regressions
    - tests/tools/test_tools.py   # all 7 tool classes

contract_deviations:
  - description: >
      IssueRef gains a new optional field 'fetch_error: str = ""'.
      This is additive — existing callers that only read title/body/comments
      are unaffected. Parrv's agent should check fetch_error before using body.
    severity: minor
  - description: >
      checkpoint() now returns a 40-char stash SHA instead of 'stash@{N}'.
      rollback() accepts both. Old stash@{N} refs are no longer produced.
    severity: minor — internal format change, callers pass ref straight back
  - description: >
      clone_repo() has a new optional kwarg 'git_ref: str | None = None'.
      Backward compatible.
    severity: none
  - description: >
      DepsResult gains a new optional field 'skipped: bool = False'.
      Backward compatible.
    severity: none
