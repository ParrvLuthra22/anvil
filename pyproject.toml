[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil"
version = "0.1.0"
description = "ANVIL: an autonomous coding-agent harness that turns a GitHub issue into a verified patch."
requires-python = ">=3.11"
dependencies = [
    "textual>=0.86",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
