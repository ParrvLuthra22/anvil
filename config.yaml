# ANVIL configuration. Never put secrets here: the API key comes only from the
# AI_API_KEY environment variable. AI_BASE_URL and AI_MODEL override the two
# provider settings below without editing this file.

# Provider (any OpenAI-compatible chat-completions endpoint).
model: gemini-2.0-flash
base_url: https://generativelanguage.googleapis.com/v1beta/openai/

# Model profile: defaults for temperature, tool_mode, max_context_tokens, max_output_tokens and strip_reasoning,
# chosen from the model name (deepseek*, qwen*/qwq*, anything else). Anything set explicitly in this file wins.
#   auto | default | deepseek | deepseek-reasoning | qwen | qwen-reasoning
model_profile: auto

# 0 = greedy decoding, reproducible. Reasoning models (DeepSeek-R1, QwQ, Qwen3 thinking) loop under it: for those,
# delete this line to use the profile's 0.6, or set it. `python -m anvil.llm.probe` warns when this applies.
temperature: 0

# Cap on tokens per reply (sent as max_tokens). Unset: the profile decides (4096 for Qwen, 8192 for DeepSeek chat, none for
# reasoning models, whose thinking would be cut off). `null` means the provider's own default. Providers reserve this much
# against the account before answering, so a low-credit key can be refused (HTTP 402) at a large value: lower it if so.
# max_output_tokens: 4096

# Remove <think>...</think> blocks and reasoning_content from replies (they still count towards token usage).
strip_reasoning: true

# Extra fields for every request body, for provider-specific switches, for example:
#   llm_extra_params: {top_p: 0.8}                   # sampling
#   llm_extra_params: {enable_thinking: false}       # DashScope Qwen3, non-streaming
# A field the endpoint rejects with HTTP 400 is dropped once and remembered for the run.
# llm_extra_params: {}

# How tools are offered to the model.
#   native: use the provider's tool-calling API
#   text:   describe the tools in the prompt and parse a fenced JSON block from the reply
#   auto:   try native, fall back to text permanently if the provider can't do it
tool_mode: auto

# LLM transport: retries on 429 / 5xx / network errors use exponential backoff with jitter.
llm_max_attempts: 5             # total tries per request, including the first
llm_timeout_seconds: 120        # per-request read/write timeout
llm_connect_timeout_seconds: 10
llm_backoff_base_seconds: 1.0
llm_backoff_max_seconds: 60     # cap on any single wait, including a Retry-After header

# Budgets: the run stops gracefully (still emitting patch + report) when any is hit.
max_steps_per_phase: 25
max_total_steps: 120
max_tokens_total: 1500000
wall_clock_seconds: 1800

# Maximum characters of any single tool/shell output fed back to the model; longer output
# keeps its head and tail with a "[N lines omitted]" marker.
tool_output_char_cap: 8000

# Feature switches. The value shown is the default; a switch that is off gives exactly the behaviour from before it existed.
features:
  # Spend fewer tokens per model call: read_file results over token_saving.read_file_max_lines are cut to their first
  # lines plus an outline; every phase gets a call cap, after which the harness forces its phase_done; old tool output
  # is dropped sooner and output is capped lower; the repository map is smaller; report.md lists tokens per phase.
  token_budgets: true
  # Extra PATCH and REVIEW rules for models that are careless about conventions: raise the most specific built-in
  # exception with a clear message (never assert), follow how the module reports similar errors, keep changes minimal.
  # OFF pending measurement on real instances (a toy-repo A/B showed no clear gain); turn it on only with evidence.
  weak_model_prompts: false
  # Before FINALIZE, check the patch itself: it must not be empty, must apply (git apply --check) in a scratch worktree
  # at the base commit, and must not edit test files unless the issue is about tests (those changes are taken out of it).
  # An empty or non-applying patch gets ONE forced-fix retry with the reason in the prompt; the outcome is in report.md.
  # A patch that adds a bare assert in non-test code (an assert is not validation) is a warning that earns the same one retry.
  patch_sanity: true
  # Offer the outline(path) and find_symbol(name) tools in LOCALIZE and PATCH (only there; find_references is never
  # offered), so the model can pick a line range instead of reading a whole file. Tools the registry lacks are skipped.
  # OFF until measured: turn it on only if tokens per call drop on a real run (report.md has the per-phase table).
  nav_tools: false

# Numbers for features.token_budgets. The two below only ever tighten context_keep_steps and tool_output_char_cap above.
token_saving:
  read_file_max_lines: 150      # a read_file result longer than this is shortened (ask for a line range for more)
  read_file_head_lines: 60      # ... to this many leading lines plus an outline of the whole file
  context_keep_steps: 3
  tool_output_char_cap: 4000
  repo_map_chars: 3000          # size of the repository map in every prompt (the map itself defaults to 6000)
  # Call caps per phase. A cap of N gives the model N calls of its own, and call N+1 is the harness's forced close, so a phase makes at most N+1 calls.
  # If the model does not end the phase at that forced close, the harness closes it itself with a summary of the calls made.
  # Order of the phases is UNDERSTAND, LOCALIZE, REPRODUCE, PATCH (per attempt), VERIFY, REVIEW. From real runs: a model that
  # closes REPRODUCE does so in 3 to 6 calls (one that does not never closes it, 10 is enough), REVIEW takes 4 to 5.
  phase_calls: {understand: 1, localize: 8, reproduce: 10, patch: 15, verify: 8, review: 6}

# Context window management: the prompt is kept under max_context_tokens (estimated at
# chars/4; leave headroom for the tool schemas, which are sent separately).
#   context_keep_steps: tool output from earlier steps is replaced by a one-line summary
#   context_summarize_threshold: past this fraction of the budget, old turns are folded into
#                                a summary (one extra LLM call), or dropped if that fails
max_context_tokens: 32000
context_keep_steps: 6
context_summarize_threshold: 0.75

# Recovery: after this many failed PATCH/VERIFY attempts the tree is rolled back to the
# checkpoint taken at the start of PATCH and the model must try a different hypothesis.
# After max_rollbacks rollbacks the run stops trying and reports low confidence.
max_patch_attempts: 3
max_rollbacks: 2

# Install the repository's dependencies after profiling (Python: into a venv in .anvil_venv, put first on
# PATH for every command). Without them the tests usually cannot import the code. Set false to skip.
install_dependencies: true

# Timeout for commands the harness itself runs (repro checks) and where run artifacts go.
command_timeout_seconds: 120
output_dir: output

# Optional cost reporting (USD per million tokens). 0 = free tier / unknown.
cost_per_million_prompt_tokens: 0
cost_per_million_completion_tokens: 0

# Sandbox backend: worktree | docker | auto (docker if its daemon is up, else worktree).
# worktree is the default: commands run in a git worktree with the repo's dependencies in a venv.
# docker is opt-in: its containers have no network, so dependencies cannot be installed in them.
sandbox: worktree
